name: Build check

# Checks that pull requests into main compile and pass tests. No APK is uploaded;
# use the Release workflow to publish an APK.
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build
        run: ./gradlew --no-daemon assembleRelease
